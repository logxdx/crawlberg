name: CI Plugin

# Freshness gate for the coding-agent plugin (lives in plugin/, generated by ai-rulez).
# Verifies the generated per-runtime bundles match plugin/.ai-rulez (BLAKE3 provenance)
# and that the plugin version tracks the core Cargo.toml version. Regenerate locally with
# `task plugin:generate`; re-sync the version with `task version:sync`.

on:
  push:
    branches: [main]
    paths:
      # Cargo.toml is the version source of truth the plugin must track. Without it
      # here a release commit — which bumps Cargo.toml and nothing under plugin/ —
      # does not trigger this workflow, so the version gate below never runs and the
      # plugin silently falls a release behind. That is how plugin/ sat at 1.3.1
      # while core shipped 1.3.2 and 1.3.3. ~keep
      - "Cargo.toml"
      - "plugin/**"
      - "package.json"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - ".ai-rulez/config.toml"
      - "scripts/sync_plugin_version.py"
      - "scripts/tests/**"
      - ".task/tools/version-sync.yml"
      - ".github/workflows/ci-plugin.yaml"
  # ~keep TEMPORARY: pull_request CI is disabled repo-wide while the org's Actions runners are
  # ~keep saturated by the open PR backlog; CI runs on pushes to main only. Restore this block
  # ~keep before merging any PR that needs its own CI.
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "Cargo.toml"
  #     - "plugin/**"
  #     - ".claude-plugin/**"
  #     - ".agents/plugins/**"
  #     - ".ai-rulez/config.toml"
  #     - "scripts/sync_plugin_version.py"
  #     - ".task/tools/version-sync.yml"
  #     - ".github/workflows/ci-plugin.yaml"
  workflow_dispatch:

concurrency:
  group: ci-plugin-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-freshness:
    name: Plugin bundle freshness
    if: github.repository == 'xberg-io/crawlberg' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out pinned ai-rulez source
        uses: actions/checkout@v7
        with:
          repository: Goldziher/ai-rulez
          ref: 8dfebd2b8b3700ff134f86886d5b44dca82abc18
          path: .tools/ai-rulez
      - uses: actions/setup-go@v6
        with:
          go-version-file: .tools/ai-rulez/go.mod
          cache-dependency-path: .tools/ai-rulez/go.sum
      - name: Build pinned ai-rulez with static native dependencies
        working-directory: .tools/ai-rulez
        shell: bash
        run: |
          set -euo pipefail
          eval "$(bash scripts/setup-liter-llm.sh)"
          mkdir -p "$RUNNER_TEMP/ai-rulez-bin"
          go build -o "$RUNNER_TEMP/ai-rulez-bin/ai-rulez" ./cmd/ai-rulez
          echo "$RUNNER_TEMP/ai-rulez-bin" >> "$GITHUB_PATH"
      # Plugin version must track the core crate version (task version:sync keeps it pinned).
      - name: Verify plugin version tracks core
        run: python3 scripts/sync_plugin_version.py --check
      # Byte-verify the ai-rulez-generated bundles under plugin/ match plugin/.ai-rulez.
      # Pinned to the ai-rulez version that generates them; bump in lockstep. ~keep
      - name: Verify generated plugin bundles are current
        run: ai-rulez verify --recursive --plugin --if-configured
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify OpenCode tools and bundled content
        run: node --test scripts/tests/opencode-plugin.test.mjs
