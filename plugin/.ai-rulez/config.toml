version = "5.0"
name = "crawlberg"
description = "Web crawling and scraping with HTML→Markdown and headless-Chrome fallback."
# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
agents_md = false
# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
gitignore = true

[plugin]
runtimes = ["claude", "cursor", "codex", "gemini", "kimi", "opencode", "factory", "hermes", "pi"]
name = "crawlberg"
version = "1.10.3"
display_name = "Crawlberg"
description = "Web crawling and scraping with HTML→Markdown and headless-Chrome fallback."
homepage = "https://xberg.io"
repository = "https://github.com/xberg-io/crawlberg"
license = "MIT"
category = "web-scraping"
brand_color = "#7C3AED"
icon = "./assets/icon.svg"
logo = "./assets/logo.png"
keywords = ["web-scraping", "crawling", "html-to-markdown", "headless-chrome"]

[plugin.author]
name = "Kreuzberg, Inc."
email = "contact@xberg.io"
url = "https://xberg.io"

[[plugin.mcp]]
name = "crawlberg"
command = "${PLUGIN_ROOT}/scripts/mcp-launch.sh"
args = ["mcp"]

[plugin.interface]
display_name = "Crawlberg"
short_description = "Crawl and scrape sites to clean markdown"
long_description = "Scrape single pages, crawl entire sites, or map a domain's URLs through the local crawlberg CLI. Every page is converted to clean Markdown via the built-in HTML→Markdown engine. WAF-blocked or JS-heavy pages transparently fall back to a headless Chrome backend."
developer_name = "Kreuzberg, Inc."
category = "web-scraping"
capabilities = ["Read", "Write"]
default_prompt = ["Crawl this site to markdown", "Scrape a single page", "Fall back to headless mode"]
website_url = "https://xberg.io"
privacy_policy_url = "https://xberg.io/privacy"
terms_of_service_url = "https://xberg.io/terms"
composer_icon = "./assets/icon.svg"
logo = "./assets/logo.png"
brand_color = "#7C3AED"

[plugin.gemini]
context_file_name = "GEMINI.md"

# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
[header]
hashes = "full"
